<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pembayaran - Modjoer Makmoer</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/logo.png">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Vanilla CSS -->
    <link rel="stylesheet" href="style.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:wght@400;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
</head>

<body>

    <!-- Navigasi -->
    <nav class="navbar navbar-expand-md sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="assets/logo.png" alt="Modjoer Makmoer" class="logo-img">
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="material-symbols-outlined text-primary">menu</span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav mx-auto mb-2 mb-md-0 d-flex gap-md-4 align-items-center">
                    <li class="nav-item">
                        <a class="nav-link mini-text" href="index.html">Beranda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link mini-text" href="index.html#about">Kisah Kami</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link mini-text" href="index.html#contact">Lokasi</a>
                    </li>
                    <li class="nav-item ms-md-2">
                        <a class="nav-link mini-text text-primary fw-bold menu-link-indicator" href="menu.html">Menu &
                            Pesan</a>
                    </li>
                </ul>

                <div class="header-icons d-flex gap-2">
                    <button class="btn border-0 position-relative" aria-label="Cart" id="checkout-cart-top-btn">
                        <span class="material-symbols-outlined">shopping_cart</span>
                        <span
                            class="position-absolute top-0 start-100 translate-middle badge rounded-pill cart-badge d-none"
                            id="cart-counter">0</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Halaman Checkout -->
    <main class="flex-grow-1 py-5">
        <div class="container">
            <div class="mb-5">
                <h1 class="big-title">Pembayaran Aman</h1>
                <p class="fs-5 text-muted mt-2">Selesaikan pesanan Anda.</p>
            </div>

            <div class="row gy-5">

                <!-- Kolom Kiri: Ringkasan Pesanan -->
                <div class="col-lg-5 order-2 order-lg-1">
                    <div class="card border-0 shadow-sm sticky-top checkout-surface-card checkout-summary-card">
                        <div class="card-body p-4">
                            <h2 class="small-title fs-4 mb-4">Ringkasan Pesanan</h2>

                            <!-- Daftar Item -->
                            <div class="d-flex flex-column gap-4 mb-4" id="checkout-item-list">
                                <!-- Diisi oleh JS -->
                            </div>

                            <hr class="my-4 checkout-divider">

                            <!-- Total -->
                            <div class="d-flex flex-column gap-2">
                                <div class="d-flex justify-content-between text-muted">
                                    <span>Subtotal</span>
                                    <span id="checkout-subtotal">IDR 0</span>
                                </div>
                                <div class="d-flex justify-content-between text-muted">
                                    <span>Pajak (11%)</span>
                                    <span id="checkout-tax">IDR 0</span>
                                </div>
                                <!-- Tanpa Biaya Pengiriman -->
                                <hr class="my-3 checkout-divider">
                                <div class="d-flex justify-content-between text-primary small-title fs-4">
                                    <span>Total</span>
                                    <span id="checkout-total">IDR 0</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Kolom Kanan: Detail & Pembayaran -->
                <div class="col-lg-7 order-1 order-lg-2 d-flex flex-column gap-4">
                    <form id="checkout-form" class="d-flex flex-column gap-4">
                        <!-- Form Detail Pemesan -->
                        <div class="card border-0 shadow-sm checkout-surface-card">
                            <div class="card-body p-4">
                                <h2 class="small-title fs-4 mb-4">Detail Pemesan</h2>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label for="fullName" class="form-label mini-text">Nama Lengkap</label>
                                        <input type="text" class="form-control" id="fullName"
                                            placeholder="Contoh: Budi Santoso">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="phone" class="form-label mini-text">Nomor Telepon / WhatsApp</label>
                                        <input type="tel" class="form-control" id="phone"
                                            placeholder="Contoh: 08123456789">
                                    </div>
                                    <div class="col-12">
                                        <label for="address" class="form-label mini-text">Nomor Meja (Dine-in) / Alamat
                                            (Delivery)</label>
                                        <textarea class="form-control" id="address" rows="2"
                                            placeholder="Contoh: Meja 04 / Jl. Mawar No. 12..."></textarea>
                                    </div>
                                    <div class="col-12">
                                        <label for="notes" class="form-label mini-text">Catatan Pesanan
                                            (Opsional)</label>
                                        <input type="text" class="form-control" id="notes"
                                            placeholder="Contoh: Es dipisah, sambal sedikit">
                                    </div>
                                </div>
                            </div>
                        </div>
                </div>

                <!-- Metode Pembayaran -->
                <div class="card border-0 shadow-sm checkout-surface-card">
                    <div class="card-body p-4">
                        <h2 class="small-title fs-4 mb-4">Metode Pembayaran</h2>
                        <div class="row g-3">
                            <!-- Opsi 1: QRIS -->
                            <div class="col-12 col-md-6">
                                <label class="payment-option w-100 h-100">
                                    <input type="radio" name="payment" value="QRIS" checked>
                                    <div class="payment-inner h-100">
                                        <span class="material-symbols-outlined mb-2 fs-1">qr_code_scanner</span>
                                        <span class="fw-semibold">QRIS</span>
                                    </div>
                                </label>
                            </div>
                            <!-- Opsi 2: Cash -->
                            <div class="col-12 col-md-6">
                                <label class="payment-option w-100 h-100">
                                    <input type="radio" name="payment" value="Cash">
                                    <div class="payment-inner h-100">
                                        <span class="material-symbols-outlined mb-2 fs-1">payments</span>
                                        <span class="fw-semibold">Cash (Bayar di Kasir)</span>
                                    </div>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tombol Aksi -->
                <div class="mt-2">
                    <button id="checkout-submit-btn"
                        class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2 py-3 fs-5 rounded-3 shadow-sm"
                        type="submit" disabled>
                        <span class="material-symbols-outlined">lock</span>
                        Buat Pesanan
                    </button>
                </div>
                </form>
            </div>

        </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="row gy-4">
                <div class="col-md-4">
                    <div class="footer-brand mb-2">Modjoer Makmoer</div>
                    <p class="text-muted small m-0">© ETS PWEB - Modjoer Makmoer.</p>
                </div>
                <div class="col-md-8">
                    <div class="footer-links d-flex flex-wrap gap-4 justify-content-md-end">
                        <a href="menu.html">Menu Kami</a>
                        <a href="index.html#about">Kisah Kami</a>
                        <a href="https://wa.me/628974294466" target="_blank">WhatsApp</a>
                        <a href="https://maps.google.com/maps?q=-7.5150896,112.5157999" target="_blank">Maps</a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <!-- Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
